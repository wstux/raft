name: Unit tests verification

on:
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: "Unit tests (${{ matrix.ut-name }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ut-name: "Standard"
            make-flags: ""

          - ut-name: "Address, Leak and UB sanitizers"
            make-flags: "-- --sanitizer_addr --sanitizer_leak --sanitizer_ub"

          - ut-name: "Thread sanitizer"
            make-flags: "-- --sanitizer_thread"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build project
      run: make ${{ matrix.make-flags }}

    - name: Run unit tests
      run: make test ${{ matrix.make-flags }}
